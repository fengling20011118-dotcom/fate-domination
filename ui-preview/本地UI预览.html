/* 主菜单背景：缓慢推镜 + 鼠标轻微视差 + 呼吸光雾 */
:root{--bg-px:0px;--bg-py:0px;--light-x:66%;--light-y:31%}
.bg{inset:0!important;will-change:transform,filter;transform-origin:center center;animation:fd-bg-cinematic 18s ease-in-out infinite alternate!important}
.ambient-light,.ambient-mist{position:absolute;inset:-14%;pointer-events:none;will-change:transform,opacity}
.ambient-light{background:radial-gradient(circle at var(--light-x) var(--light-y),rgba(255,232,177,.16) 0,rgba(205,221,255,.07) 13%,transparent 34%);filter:blur(18px);mix-blend-mode:screen;animation:fd-light-breathe 6.5s ease-in-out infinite alternate}
.ambient-mist{inset:-18%;opacity:.18;background:radial-gradient(ellipse at 38% 30%,rgba(220,230,244,.15),transparent 29%),radial-gradient(ellipse at 72% 46%,rgba(255,240,202,.1),transparent 25%),linear-gradient(110deg,transparent 22%,rgba(224,233,244,.08) 46%,transparent 67%);filter:blur(26px);animation:fd-mist-drift 16s ease-in-out infinite alternate;mix-blend-mode:screen}
@keyframes fd-bg-cinematic{0%{transform:translate3d(calc(var(--bg-px) - 1px),calc(var(--bg-py) - 1px),0) scale(1.006)}100%{transform:translate3d(calc(var(--bg-px) + 2px),calc(var(--bg-py) + 1px),0) scale(1.012)}}
@keyframes fd-light-breathe{0%{opacity:.45;transform:translate3d(-1.2%,-.5%,0) scale(.98)}100%{opacity:.95;transform:translate3d(1.4%,.8%,0) scale(1.05)}}
@keyframes fd-mist-drift{0%{transform:translate3d(-2.5%,.3%,0) scale(1.01);opacity:.11}100%{transform:translate3d(2.8%,-.6%,0) scale(1.06);opacity:.23}}
@media(prefers-reduced-motion:reduce){.bg,.ambient-light,.ambient-mist{animation:none!important}.bg{transform:scale(1)}}

/* 首页顶栏去框，保留 Logo 与可点击玩家资料 */
.topbar{border-bottom:0!important;background:transparent!important}
.profile{border:0!important;background:transparent!important;padding:4px 0 4px 8px!important;color:#f5f1e8;cursor:pointer;transform-origin:right center;transition:transform .18s cubic-bezier(.16,1,.3,1),filter .18s ease}
.profile:hover{transform:scale(1.06);filter:brightness(1.06)}
.profile-badge{background:rgba(8,12,19,.34)}

/* 选人连体面板：左 / 中 / 右统一深色底，提升可读性 */
.lol-draft-layout{
  gap:0!important;
  padding-top:18px!important;
  border:1px solid rgba(166,197,216,.16);
  background:linear-gradient(180deg,rgba(5,15,25,.82),rgba(2,8,15,.90));
  backdrop-filter:blur(14px) saturate(112%);
  -webkit-backdrop-filter:blur(14px) saturate(112%);
  box-shadow:0 22px 54px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.025);
}
.lol-side,.lol-pool{
  background:linear-gradient(180deg,rgba(8,21,33,.74),rgba(3,11,19,.78))!important;
}
.lol-side{
  border-top:0!important;
  border-bottom:0!important;
}
.lol-side-left{
  border-right:1px solid rgba(164,196,216,.13)!important;
}
.lol-side-right{
  border-left:1px solid rgba(164,196,216,.13)!important;
}
.lol-pool{
  position:relative;
  border-left:0!important;
  border-right:0!important;
}
.lol-pool:before,
.lol-pool:after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  width:1px;
  z-index:4;
  pointer-events:none;
  background:linear-gradient(180deg,rgba(176,207,225,.04),rgba(176,207,225,.15) 14%,rgba(176,207,225,.10) 86%,rgba(176,207,225,.03));
}
.lol-pool:before{left:0}
.lol-pool:after{right:0}
.lol-pool-tools{
  min-height:50px!important;
  padding:9px 14px 10px!important;
  background:linear-gradient(180deg,rgba(16,33,48,.82),rgba(7,20,31,.76));
  border-bottom:1px solid rgba(169,199,217,.13)!important;
}
.lol-grid-wrap{
  padding:17px 15px 20px!important;
  background:
    radial-gradient(circle at 50% 12%,rgba(67,111,138,.08),transparent 34%),
    linear-gradient(180deg,rgba(6,18,29,.58),rgba(2,10,17,.66));
}
.lol-pick-grid{
  align-content:start;
  gap:10px!important;
}
.lol-pick-grid .pick-card{
  background:linear-gradient(180deg,rgba(14,34,50,.97),rgba(4,15,25,.98))!important;
  border-color:rgba(145,178,198,.21)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025)!important;
}
.lol-pick-grid .pick-card:hover{
  border-color:rgba(220,232,239,.58)!important;
  box-shadow:0 12px 28px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.04)!important;
}
.lol-pick-grid .pick-card.active{
  border-color:#c3a66b!important;
  box-shadow:0 0 0 1px rgba(195,166,107,.36),0 0 22px rgba(195,166,107,.12)!important;
}
.lol-class-filter button,
.lol-pool-tools>button{
  text-shadow:0 1px 2px rgba(0,0,0,.45);
}

/* 3X 同样使用完整连体深色面板 */
.threex-page{
  gap:0!important;
  border:1px solid rgba(166,197,216,.16)!important;
  background:linear-gradient(180deg,rgba(5,15,25,.82),rgba(2,8,15,.90))!important;
  backdrop-filter:blur(14px) saturate(112%);
  -webkit-backdrop-filter:blur(14px) saturate(112%);
  box-shadow:0 22px 54px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.025)!important;
}
.threex-stepper{
  background:linear-gradient(180deg,rgba(16,33,48,.82),rgba(7,20,31,.78))!important;
  border-bottom:1px solid rgba(169,199,217,.13)!important;
}
.threex-content{
  background:
    radial-gradient(circle at 50% 8%,rgba(67,111,138,.08),transparent 34%),
    linear-gradient(180deg,rgba(7,20,31,.76),rgba(2,10,17,.84))!important;
  border:0!important;
  padding:20px 28px 24px!important;
}
.threex-content .pick-card{
  background:linear-gradient(180deg,rgba(14,34,50,.97),rgba(4,15,25,.98))!important;
  border-color:rgba(145,178,198,.21)!important;
}
.threex-content .pick-card:hover{
  border-color:rgba(220,232,239,.58)!important;
}
.threex-head{
  margin-left:-28px;
  margin-right:-28px;
  padding:0 28px 15px!important;
  border-bottom:1px solid rgba(169,199,217,.12)!important;
}
.purchase-grid,.setup-summary,.turn-order{
  position:relative;
  z-index:1;
}
.purchase-card,.setup-summary div{
  background:linear-gradient(180deg,rgba(11,28,42,.78),rgba(4,14,23,.82))!important;
  border-color:rgba(145,178,198,.16)!important;
}
@media(max-width:1200px){
  .lol-draft-layout{grid-template-columns:170px minmax(0,1fr) 190px!important}
  .threex-content{padding-left:20px!important;padding-right:20px!important}
  .threex-head{margin-left:-20px;margin-right:-20px;padding-left:20px!important;padding-right:20px!important}
}

function positionCharacterSkillPreview(target,box){
 const rect=target.getBoundingClientRect(),gap=18,margin=14,width=box.offsetWidth||430,height=Math.min(box.offsetHeight||420,window.innerHeight-margin*2);
 let left=rect.right+gap;if(left+width>window.innerWidth-margin)left=rect.left-width-gap;
 left=Math.max(margin,Math.min(left,window.innerWidth-width-margin));
 let top=rect.top+(rect.height-height)/2;top=Math.max(margin,Math.min(top,window.innerHeight-height-margin));
 box.style.left=left+'px';box.style.top=top+'px';
}
function hideCharacterSkillPreview(){
 window.clearTimeout(characterSkillPreviewTimer);characterSkillPreviewTimer=0;characterSkillPreviewTarget=null;
 const box=document.getElementById('characterSkillPreview');if(box){box.classList.remove('active');box.setAttribute('aria-hidden','true')}
}
function resetDocumentPreviews(){hideCodexImagePreview();hideCharacterSkillPreview()}
function showCharacterSkillPreview(target){
 const info=characterSkillPreviewData(target);if(!info||characterSkillPreviewTarget!==target||!target.matches(':hover'))return;
 const label=info.kind==='master'?'MASTER · 御主能力':((info.data.class||'SERVANT')+' · 从者技能');
 const items=info.skills.length?info.skills.map((skill,index)=>'<article class="character-skill-preview-item"><span class="character-skill-preview-index">'+String(index+1).padStart(2,'0')+'</span><div class="character-skill-preview-copy"><header><b>'+esc(skill.name||'未命名技能')+'</b><em>'+esc(skill.type||'技能')+'</em></header><p>'+esc(skill.text||'暂无技能描述').replace(/\r?\n/g,'<br>')+'</p></div></article>').join(''):'<div class="character-skill-preview-empty">暂无技能资料</div>';
 const box=ensureCharacterSkillPreview();box.innerHTML='<header class="character-skill-preview-head"><div><small>'+label+'</small><strong>'+esc(info.name)+'</strong></div><span>'+info.skills.length+' 个技能</span></header><div class="character-skill-preview-list">'+items+'</div>';
 box.classList.add('active');box.setAttribute('aria-hidden','false');positionCharacterSkillPreview(target,box);
}
document.addEventListener('mouseover',e=>{
 const target=e.target.closest&&e.target.closest('[data-character-kind][data-character-name]');
 if(!target||(e.relatedTarget&&target.contains(e.relatedTarget)))return;
 hideCharacterSkillPreview();characterSkillPreviewTarget=target;
 characterSkillPreviewTimer=window.setTimeout(()=>showCharacterSkillPreview(target),2000);
});
document.addEventListener('mouseout',e=>{
 const target=e.target.closest&&e.target.closest('[data-character-kind][data-character-name]');
 if(!target||(e.relatedTarget&&target.contains(e.relatedTarget)))return;
 if(characterSkillPreviewTarget===target)hideCharacterSkillPreview();
});
document.addEventListener('pointerdown',hideCharacterSkillPreview);
function openUiDialog(modal,panelSelector){if(!modal)return;resetDocumentPreviews();modal.classList.add('open');const panel=modal.querySelector(panelSelector),motion=window.anime;if(panel&&motion&&typeof motion.animate==='function'){motion.animate(panel,{opacity:[0,1],y:[14,0],duration:260,ease:'outCubic'});const items=[...panel.querySelectorAll('.avatar-choice,.battle-bg-choice')];if(items.length)motion.animate(items,{opacity:[0,1],y:[7,0],delay:motion.stagger?motion.stagger(28):0,duration:220,ease:'outCubic'})}}
function closeUiDialog(modal){resetDocumentPreviews();if(modal)modal.classList.remove('open')}
document.addEventListener('click',e=>{
 if(screen==='splash'){enterHomeFromSplash();return}
 const avatarToggle=e.target.closest('[data-avatar-toggle]');if(avatarToggle){avatarPickerOpen=true;openUiDialog(document.querySelector('.avatar-picker-modal'),'.avatar-picker-dialog');return}
 const avatarChoice=e.target.closest('[data-avatar-choice]');if(avatarChoice){playerProfile.avatar=normalizeProfileAvatar(avatarChoice.dataset.avatarChoice||'');savePlayerProfile();avatarPickerOpen=false;const avatarButton=document.querySelector('.profile-avatar-large');if(avatarButton)avatarButton.innerHTML=avatarContent()+'<span class="avatar-edit-hint">更换</span>';closeUiDialog(document.querySelector('.avatar-picker-modal'));return}
 const profile=e.target.closest('[data-profile]');if(profile){avatarPickerOpen=false;go('profile');return}
 const save=e.target.closest('[data-save-profile]');if(save){const input=document.getElementById('playerNameInput');playerProfile.name=(input&&input.value.trim())||'御主';savePlayerProfile();renderPlayerProfile();return}
 const nav=e.target.closest('[data-nav]');if(nav){go(nav.dataset.nav);return}
 const avatarClose=e.target.closest('[data-avatar-close]');if(avatarClose||e.target.matches('[data-avatar-backdrop]')){avatarPickerOpen=false;closeUiDialog(document.querySelector('.avatar-picker-modal'));return}
 const bgOpen=e.target.closest('[data-open-bg-settings]');if(bgOpen&&screen==='settings'){settingsBackgroundOpen=true;openUiDialog(document.querySelector('.settings-bg-modal'),'.settings-bg-dialog');return}
 const bgClose=e.target.closest('[data-close-bg-settings]');if((bgClose||e.target.matches('[data-settings-bg-backdrop]'))&&screen==='settings'){settingsBackgroundOpen=false;closeUiDialog(document.querySelector('.settings-bg-modal'));return}
 const bgChoice=e.target.closest('[data-battle-bg]');if(bgChoice&&screen==='settings'){chooseBattleBackground(bgChoice.dataset.battleBg);return}
 if(e.target.closest('.back')){if(screen==='codex-detail'){go('codex')}else if(screen==='character-select'||screen==='three-x-setup'||screen==='single-setup'){go(setupSource==='multi'?'multi-create':'single')}else if(screen==='multi-create'||screen==='multi-join')go('multi');else go('home');return}
 const join=e.target.closest('[data-join-room]');if(join){go('multi-join');return}
 const m=e.target.closest('[data-mode]');if(m){chosenMode=m.dataset.mode;if(screen==='multi'){resetMultiplayerLobby();go('multi-create')}else startSetup('single',chosenMode);return}
 const roomStart=e.target.closest('[data-room-start]');if(roomStart&&screen==='multi-create'&&multiplayerHumansReady()){prepareMultiplayerLaunch();startSetup('multi',chosenMode);return}
 const battleEntry=e.target.closest('[data-enter-battle-preview]');if(battleEntry){startBattleTransition();return}
 const battleExit=e.target.closest('[data-battle-exit]');if(battleExit&&screen==='battle-preview'){go('home');return}
 const stage=e.target.closest('[data-standard-stage]');if(stage&&!selectionLocked){switchStandardStage(stage.dataset.standardStage);return}
 const pm=e.target.closest('[data-pick-master]');if(pm&&!selectionLocked&&standardPickStage==='master'){selectedMaster=pm.dataset.pickMaster;renderCharacterSelect();return}
 const ps=e.target.closest('[data-pick-servant]');if(ps&&!selectionLocked&&standardPickStage==='servant'){selectedServant=ps.dataset.pickServant;renderCharacterSelect();return}
 const pc=e.target.closest('[data-pick-class]');if(pc&&!selectionLocked&&standardPickStage==='servant'){standardClass=pc.dataset.pickClass;renderCharacterSelect();return}
 if(e.target.closest('[data-standard-next]')&&!selectionLocked){if(standardPickStage==='master'&&selectedMaster){switchStandardStage('servant');return}if(standardPickStage==='servant'&&selectedServant){selectionLocked=true;renderCharacterSelect();requestAnimationFrame(animateRouteIn);return}}
 const xb=e.target.closest('[data-threex-ban]');if(xb&&threeXStep==='ban'){threeXBannedMaster=xb.dataset.threexBan;renderThreeXSetup();return}
 if(e.target.closest('[data-threex-confirm-ban]')&&threeXBannedMaster&&threeXStep==='ban'){threeXMasterCandidates=sampleUnique(masters,3,[threeXBannedMaster]);threeXSelectedMaster='';threeXStep='master';renderThreeXSetup();return}
 const xm=e.target.closest('[data-threex-master]');if(xm&&threeXStep==='master'){threeXSelectedMaster=xm.dataset.threexMaster;renderThreeXSetup();return}
 if(e.target.closest('[data-threex-confirm-master]')&&threeXSelectedMaster&&threeXStep==='master'){threeXCrystals=threeXRatings[threeXSelectedMaster]??4;threeXServantCandidates=sampleUnique(servants,1);threeXStep='purchase';renderThreeXSetup();return}
 const buy=e.target.closest('[data-threex-buy]');if(buy&&threeXStep==='purchase'){const type=buy.dataset.threexBuy,cost=purchaseCost(type),count=threeXPurchases[type]||0,maxed=type==='seal'?count>=1:count>=5;if(!maxed&&threeXCrystals>=cost){if(type==='servant'){const next=sampleUnique(servants,1,threeXServantCandidates.map(x=>x[0]));if(!next.length)return;threeXServantCandidates=threeXServantCandidates.concat(next)}threeXCrystals-=cost;threeXPurchases[type]=count+1;renderThreeXSetup()}return}
 if(e.target.closest('[data-threex-finish-purchase]')&&threeXStep==='purchase'){threeXCrystals=0;threeXStep='servant';renderThreeXSetup();return}
 const xs=e.target.closest('[data-threex-servant]');if(xs&&threeXStep==='servant'){threeXSelectedServant=xs.dataset.threexServant;renderThreeXSetup();return}
 if(e.target.closest('[data-threex-confirm-servant]')&&threeXSelectedServant&&threeXStep==='servant'){threeXStep='complete';renderThreeXSetup();requestAnimationFrame(animateRouteIn);return}
 const entry=e.target.closest('[data-entry]');if(entry){const originNode=entry.querySelector('.codex-portrait')||entry,originRect=originNode.getBoundingClientRect();codexDetailOrigin={left:originRect.left,top:originRect.top,width:originRect.width,height:originRect.height};codexDetailName=entry.dataset.entry;codexDetailKind=entry.dataset.entryKind||'servant';codexDetailTab='skills';go('codex-detail');return}
 const detailTab=e.target.closest('[data-codex-detail-tab]');if(detailTab&&screen==='codex-detail'){codexDetailTab=detailTab.dataset.codexDetailTab;renderCodexDetail();return}
 const t=e.target.closest('[data-tab]');if(t){codexTab=t.dataset.tab;codexClass='全部';renderCodex();return}
 const c=e.target.closest('[data-class]');if(c){codexTab='servant';codexClass=c.dataset.class;renderCodex();return}
});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='battleBackgroundUpload'){const file=e.target.files&&e.target.files[0];if(file)importBattleBackground(file)}});
document.addEventListener('keydown',e=>{if(screen==='splash'&&!e.ctrlKey&&!e.altKey&&!e.metaKey){enterHomeFromSplash();return}if(e.key==='Escape'&&screen!=='home'){if(screen==='battle-preview'){return}if(screen==='codex-detail')go('codex');else if(screen==='character-select'||screen==='three-x-setup'||screen==='single-setup')go(setupSource==='multi'?'multi-create':'single');else if(screen==='multi-create'||screen==='multi-join')go('multi');else go('home')}});
document.addEventListener('mousemove',e=>{const nx=(e.clientX/window.innerWidth-.5)*2,ny=(e.clientY/window.innerHeight-.5)*2,r=document.documentElement.style;r.setProperty('--bg-px',(-nx*2).toFixed(2)+'px');r.setProperty('--bg-py',(-ny*1.5).toFixed(2)+'px');r.setProperty('--light-x',(66+nx*3.2).toFixed(1)+'%');r.setProperty('--light-y',(31+ny*2.2).toFixed(1)+'%')});
window.addEventListener('blur',()=>{const r=document.documentElement.style;r.setProperty('--bg-px','0px');r.setProperty('--bg-py','0px');r.setProperty('--light-x','66%');r.setProperty('--light-y','31%')});
window.addEventListener('message',e=>{if(e.data==='fd-battle-exit'&&screen==='battle-preview')go('home')});
render();
})();
</script>
</body>
</html>
